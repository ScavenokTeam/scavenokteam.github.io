<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Does SIZE matter?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffff00;
            font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', monospace;
            margin: 0;
            animation: blink-bg 0.5s step-end infinite;
        }

        @keyframes blink-bg {
            0%, 100% { background: #ffff00; }
            50% { background: #ffffff; }
        }

        .text {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            color: #000000;
            text-shadow: 2px 2px 0 #888888;
            letter-spacing: 4px;
            word-break: break-word;
            padding: 20px;
            animation: text-blink 0.6s step-end infinite;
            font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', monospace;
        }

        .text .big {
            font-size: 5.5rem;
            display: inline-block;
            font-weight: 900;
            letter-spacing: 6px;
        }

        @keyframes text-blink {
            0%, 100% { color: #000000; }
            50% { color: #222222; }
        }

        /* дополнительная "пиксельность" */
        .text {
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
        }

        @media (max-width: 600px) {
            .text { font-size: 2rem; }
            .text .big { font-size: 3.8rem; }
        }
    </style>
</head>
<body>
    <div class="text">
        Does <span class="big">SIZE</span> matter?
    </div>
</body>
</html>
